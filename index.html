<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- Должно совпадать с названием в консоли Яндекс Игр. main.ts заменит на перевод. -->
    <title>СИМУЛЯТОР ШАХТЫ</title>

    <script src="https://yandex.ru/games/sdk/v2"></script>
    <script>
      window.ysdk = null;
      // Промис готовности SDK. Без Яндекс Игр разрешается в null.
      window.ysdkReady = YaGames.init().then(ysdk => {
          window.ysdk = ysdk;
          return ysdk;
      }).catch(err => {
          console.error("Yandex SDK init failed:", err);
          return null;
      });
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
